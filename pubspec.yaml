name: angela_coro_v1
description: A new Flutter project for Angela Queen AI.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 1. الحزم الأساسية الخاصة بك
  url_launcher: ^6.3.1
  speech_to_text: ^6.6.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  audioplayers: ^5.2.1
  http: ^1.2.1
  provider: ^6.1.2
  connectivity_plus: ^6.0.3
  flutter_markdown: ^0.7.1
  flutter_highlighter: ^0.1.1
  share_plus: ^7.2.1

  # 2. الحزم المعمارية
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  get_it: ^7.6.4
  logger: ^2.0.2
  internet_connection_checker_plus: ^2.5.1

  # 3. الحزم الاحترافية للأمان والمرافق
  flutter_secure_storage: ^9.2.2
  uuid: ^4.5.1
  intl: 0.20.2
  path_provider: ^2.1.5

  # 4. بناء النماذج الاحترافية
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 5. إطلاق العنان لـ Firebase لحل التعارض تلقائياً
  firebase_core: any
  firebase_analytics: any
  firebase_crashlytics: any
  firebase_vertexai: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: any

  # 6. الوسائط المتعددة والملفات
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  flutter_tts: ^3.8.5
  mime: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/19111.jpg

# 👑 إعدادات الأيقونة الخاصة بك (تمت إضافة دعم الويندوز)
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/19111.jpg"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/19111.jpg"
  image_path: "assets/19111.jpg"

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.20